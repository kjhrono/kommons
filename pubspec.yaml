name: kommons
description: Shared app shell for kjhrono games — top bar, account/auth, settings and theme.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  qr_flutter: ^4.1.0

flutter:
  assets:
    - assets/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Platform-interface fakes for the OAuth deep-link collector tests.
  app_links_platform_interface: ^2.0.4
  url_launcher_platform_interface: ^2.3.2
