name: device_key
description: >-
  A non-exportable signing key in the device's secure hardware (Android
  Keystore / StrongBox, iOS Secure Enclave). Its public key identifies the
  device, e.g. to bind an offline license to one phone.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kjhrono.device_key
        pluginClass: DeviceKeyPlugin
      ios:
        pluginClass: DeviceKeyPlugin
