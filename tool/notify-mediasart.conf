# notify.mediasart.com — Gotify push notification server vhost (full TLS).
# TLS: shared mediasart.com certbot lineage (SAN expanded to include this name);
# cert renew is managed by certbot's webroot authenticator for mediasart.com.
# Routes to the Gotify server listening on 127.0.0.1:8050.

server {
    listen 80;
    server_name notify.mediasart.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name notify.mediasart.com;

    ssl_certificate     /etc/letsencrypt/live/mediasart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediasart.com/privkey.pem;
    include             /etc/nginx/snippets/tls-options.conf;

    # Gotify API + web UI → local container (127.0.0.1:8050)
    location / {
        proxy_pass http://127.0.0.1:8050;
        include /etc/nginx/snippets/proxy-supabase.conf;
    }
}
