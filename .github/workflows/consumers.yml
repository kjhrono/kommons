# Verifies the commons shell and every consumer game on each push/PR.
# The single source of truth for WHAT to run is the shared script — this
# workflow just installs Flutter and calls it, exactly like a developer
# would locally.
name: consumers

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout commons
        uses: actions/checkout@v5
        with:
          path: kommons

      # Kalcio is gated analyze-only by the consumer script (its own CI
      # owns its 45–90 min test battery). PRIVATE repo: the default
      # GITHUB_TOKEN cannot see it, so this step needs the same
      # fine-grained PAT used for the change alerts, this time with
      # "Contents: read" on kjhrono/kalcio (add it to the existing
      # KOMMONS_NOTIFY_TOKEN). Until the PAT carries that permission the
      # step fails and kalcio SKIPS (see the script) — CI stays green,
      # the warning below says what to fix; once granted, nothing here
      # needs to change.
      - name: Checkout kalcio (consumer)
        id: kalcio
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: kjhrono/kalcio
          ref: main
          path: kalcio
          token: ${{ secrets.KOMMONS_NOTIFY_TOKEN }}

      - name: Explain the skipped kalcio checkout
        if: steps.kalcio.outcome == 'failure'
        run: |
          echo "::warning::kalcio was NOT checked out — the consumer gate skips it this run. Give KOMMONS_NOTIFY_TOKEN 'Contents: read' on kjhrono/kalcio (repo Settings → Secrets and variables → Actions) and this gate starts running."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run all consumer gates
        run: bash kommons/tool/verify_consumers.sh

      # The change alert: after a green gate on master, ping every game
      # repo registered in the KOMMONS_NOTIFY_REPOS repository variable
      # (space-separated, e.g. "kjhrono/kalcio"). Each game opts in by
      # adding a repository_dispatch listener (see COMMONS.md) — without
      # one, the ping is a no-op for that repo. The KOMMONS_NOTIFY_TOKEN
      # secret must be a fine-grained PAT with "repository_dispatch:
      # write" on the target repos; without the secret the step skips
      # and the alert is silent.
      - name: Notify connected games (repository_dispatch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.KOMMONS_NOTIFY_TOKEN }}
          NOTIFY_REPOS: ${{ vars.KOMMONS_NOTIFY_REPOS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "KOMMONS_NOTIFY_TOKEN not set — skipping (games still see changes via the gate/badges)"
            exit 0
          fi
          if [ -z "$NOTIFY_REPOS" ]; then
            echo "KOMMONS_NOTIFY_REPOS variable not set — nothing to notify"
            exit 0
          fi
          for repo in $NOTIFY_REPOS; do
            if gh api "repos/$repo/dispatches" \
                 -f event_type=kommons_changed \
                 -f "client_payload[sha]=$GITHUB_SHA" \
                 -f "client_payload[repo]=$GITHUB_REPOSITORY"; then
              echo "alerted $repo (kommons_changed @ ${GITHUB_SHA:0:8})"
            else
              echo "::warning::could not alert $repo — check the token scope and the repo name"
            fi
          done
